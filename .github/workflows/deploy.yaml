name: Zu GitHub Pages deployen

on:
  push:
    branches:
      - dev # nur für Testzwecke; workflow wird auch im branch 'dev' gestartet
      - main # Ändern Sie dies zu 'master', falls Ihr Haupt-Branch so heißt

# Berechtigungen, die GitHub Pages zwingend für das Deployment benötigt
permissions:
  contents: read
  pages: write
  id-token: write

# Verhindert, dass mehrere Deployments gleichzeitig laufen und sich gegenseitig stören
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. Schritt: Den Code aus dem GitHub-Repository auf den Runner laden
      - name: Code auschecken
        uses: actions/checkout@v4

      # 2. Schritt: Platzhalter in der firebase-config.js mit echten Secrets ersetzen
      - name: Secrets in Firebase Config einsetzen
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          envsubst < firebase-config.js > firebase-config.js.tmp
          mv firebase-config.js.tmp firebase-config.js

      # 3. Schritt: Alle Dateien des Projekts für GitHub Pages bereitstellen
      - name: Seiten-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Punkt bedeutet: Das gesamte aktuelle Verzeichnis hochladen

      # 4. Schritt: Das eigentliche Live-Schalten auf GitHub Pages
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4